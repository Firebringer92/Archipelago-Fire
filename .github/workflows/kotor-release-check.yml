name: KotoR release check

# When a release is published, downloads its zips and runs the provenance check on them (including the .apworld inside the world zip).
# A red result here means a release contains something it must not; fix it and publish a corrected release.
# Can also be run by hand from the Actions tab against any existing release tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check (for example v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  release-files:
    name: Release zips (no game files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - name: Download the release's zips
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir assets
      - name: Check them
        run: python KotoR/Source/scripts/check_provenance.py --zip assets/*.zip
