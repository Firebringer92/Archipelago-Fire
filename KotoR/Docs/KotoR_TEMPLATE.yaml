# KOTOR Archipelago Randomizer -- player options template
#
# This is an ALPHA mod. Back up your saves and your game's modules/Override
# folders before playing a randomized seed -- see the project README for
# the full setup/backup instructions. Item Suppression and Area Randomizer
# in particular rewrite real game files in place.
#
# To use this for your own playthrough: copy this file to a new name under
# Players\ (e.g. my_game.yaml), then either edit `name:` below or delete
# this original -- Generate.py builds one seed slot per .yaml file it finds
# in Players\, so leaving both means two slots get generated. Every option
# below is documented inline with its default and what it does -- this is
# the full list Options.py exposes, nothing else exists to configure.
#
# General YAML notes: `true`/`false` toggle a Yes/No option on or off. A
# named option (like `ap_gated` or `defeat_malak`) picks one choice from a
# list -- the valid choices are listed in a comment above each option below.
# A plain number sets a Range option to that exact value. Don't quote any
# of these values. Leave `game:` below exactly as-is -- it's the fixed
# internal name Archipelago uses to find this world, not a display name.

name: TestPlayer
game: KotOR
description: KOTOR 1 Archipelago randomizer -- see README.md for setup instructions
KotOR:

  # --- Archipelago standard options ------------------------------------

  # How aggressively Archipelago tries to keep your own progression items
  # away from other players early on. 0 = off, higher = more aggressive.
  # Not KOTOR-specific -- same option every AP world has.
  progression_balancing: 50

  # Which of your own locations need to be reachable for the seed to be
  # considered valid. "items" is the safe default for this world -- see
  # Rules.py: there's no real story-order logic gating yet, so this
  # mostly just needs to stay at the default.
  accessibility: items


  # --- Character start ---------------------------------------------------

  # Controls how (and whether) you become a Jedi, using the class picked
  # in jedi_class below.
  #   off (default): vanilla -- the normal Dantooine trials handle your
  #                  class change exactly like base KOTOR.
  #   jedi_start:    the class picked in jedi_class is already in your
  #                  starting inventory, from the moment you connect.
  #   jedi_granted:  the class picked in jedi_class is a real item placed
  #                  somewhere in the shuffled pool instead -- you become
  #                  a Jedi partway through the game, whenever that item
  #                  reaches you through the archipelago items
  #   random_class:  ignores jedi_class entirely -- your OWN starting class
  #                  is independently rolled to any of all 6 classes
  #                  (Soldier/Scout/Scoundrel/Guardian/Consular/Sentinel),
  #                  applied immediately like "jedi_start" above, not item-gated.
  # Under any mode except "off", the real Dantooine trial completion is
  # suppressed so simply playing it through normally can't also grant (or
  # duplicate) a class outside this option's own control.
  # Valid: off, jedi_start, jedi_granted, random_class
  starting_class: random_class

  # Which Jedi class you become. Only matters if starting_class is jedi_start
  # or jedi_granted -- ignored entirely by random_class, which rolls its own class.
  # Valid: guardian, consular, sentinel
  jedi_class: guardian

  # Randomizes the class of the 7 non-droid companions (Bastila, Canderous,
  # Carth, Jolee, Juhani, Mission, Zaalbar -- HK-47/T3-M4 are droids and
  # never affected). Independent of starting_class/jedi_class above, which
  # only ever control the PC's own class.
  #   off (default):    vanilla -- every companion keeps their normal class.
  #   no_jedi:          all 7 companions independently roll Soldier/Scout/
  #                     Scoundrel, including Bastila/Jolee/Juhani -- no
  #                     Jedi companions at all, applied automatically the
  #                     moment each one joins.
  #   jedi_companion:   only the 4 non-Jedi companions (Carth, Canderous,
  #                     Zaalbar, Mission) independently roll Guardian/
  #                     Consular/Sentinel. Item-gated -- each gets one
  #                     guaranteed "Jedi Training" item, and their class
  #                     only changes once received. Bastila/Jolee/Juhani
  #                     untouched.
  #   randomize_all:    all 7 companions independently roll any of the 6
  #                     classes, applied automatically at recruit like
  #                     no_jedi.
  # Valid: off, no_jedi, jedi_companion, randomize_all
  companion_class: jedi_companion

  # How the 9 companions (Bastila, Carth, Canderous, HK-47, Jolee, Juhani,
  # Mission, T3-M4, Zaalbar) join your party.
  #   ap_gated (default off state below): companions are real AP checks
  #             and items -- their vanilla recruit moment is still a
  #             completed check, but they only actually join once someone
  #             sends you that companion's item.
  #   normal:   companions join exactly like base KOTOR, no AP gating --
  #             the recruit moment still registers as a check (for
  #             tracking), it just self-fulfills instantly.
  #   none:     companions never join at all. Their 9 locations are
  #             removed from the pool entirely.
  companion_mode: ap_gated

  # Replaces HK-47 with a new human companion, in his exact party slot -- a swap, not an addition. His
  # recruitment mechanism (the Tatooine droid-purchase trigger) is
  # unchanged; only who you get is different. His personal Ebon Hawk
  # subplot is removed and replaced with a single placeholder greeting.
  # When on, the AP-facing item/location names for his companion check
  # (relevant under companion_mode=ap_gated) read "New Companion" instead
  # of "HK-47". She's also folded into companion_class/additional_feats
  # like the other 7 non-droid companions.
  # false (default): vanilla HK-47, unchanged.
  new_companion: false

  # --- Extra features (quest-item gating, traps, enemies) -------------------

  # Whether "Additional Feats" items exist in the pool at all. When on, one
  # such item is placed per eligible character (the PC, plus all 7 non-droid
  # companions unless companion_mode is "none" -- HK-47/T3-M4 are droids and
  # never eligible; if new_companion is on, then new companion is eligible
  # HK-47's place). Receiving one doesn't grant anything immediately -- 3
  # random feats (weapon/armor proficiencies and class signature abilities,
  # from a fixed pool) are picked once that character is actually recruited
  # and their class has settled.
  # false (default): no such items exist.
  additional_feats: false

  # Gates 8 real main-questline items (Sith Armor, Sith Papers, Taris Shield
  # Codes, Manaan Enviro Suit, and 4 Star Maps -- Tatooine/Kashyyyk/Manaan/
  # Korriban) behind real AP checks instead of their normal vanilla pickup.
  # Also creates an artificial galaxy-map travel lock to those 4 planets
  # until their own Star Map check clears (vanilla KOTOR has no such lock at
  # all). A real access-rule layer rides on this (see Rules.py) so
  # Archipelago's own generation guarantees the seed stays completable.
  # false (default): vanilla -- all 8 items behave normally, no gating.
  # INCOMPATIBLE with area_randomizer below -- enabling both raises an error
  # at generation time.
  # ALSO REQUIRES goal (below) to be defeat_malak or reach_leviathan --
  # true_balance and max_level don't require ever reaching the Leviathan or
  # later, so the Star Maps this option gates could go permanently unfound.
  # Enabling both raises an error at generation time.
  progression_system: false

  # Whether "Trap" items exist in the pool, and how many. Each trap does
  # something purely punishing to the PC (never companions, except as the
  # deliberate target of "remove a companion"), once only, no re-triggering.
  # The 12 types: Remove All Credits, Reduce a Skill, Remove Half Known
  # Feats, Remove Half Known Force Powers, Cut Max Health in Half
  # (best-effort via Constitution -- KOTOR has no direct Max HP field, so an
  # exact 50% cut isn't always reachable), Remove a Companion (random
  # currently-recruited one, no-op if none recruited yet), Remove Half
  # Inventory Items (backpack only, quest items never eligible), and one
  # item each for Strength/Dexterity/Intelligence/Wisdom/Charisma that
  # halves that score (no standalone Constitution item -- Cut Max Health
  # already uses it). A trap with nothing to halve just does nothing.
  #   off (default):  no trap items exist.
  #   item_filler:    traps are one more weighted category of the normal
  #                   item distribution (see trap_weight below) -- how many
  #                   you get scales with the pool, and types can repeat.
  #   fixed_amount:   exactly 12 traps, one of each type, always.
  # (`true`/`false` still work here and mean fixed_amount/off.)
  # Valid: off, item_filler, fixed_amount
  enable_traps: off

  # Adds brand-new hostile creatures alongside whatever's already placed in
  # an area -- existing enemies/scripts/encounters are never touched or
  # removed, this only adds more. Locations are fixed, safety-checked spots
  # per module; only WHICH creature goes in each slot is decided per seed.
  #   off (default):     vanilla, no additions.
  #   area_appropriate:  new creatures drawn only from OTHER creatures
  #                       native to that area's own planet, matched to
  #                       roughly that area's own existing difficulty.
  #   random_sane:       any creature from the safe pool (any planet), still
  #                       matched to that area's own difficulty range.
  #   fully_random:      any creature from the safe pool, no planet or
  #                       difficulty restriction at all -- most variety,
  #                       least predictable difficulty (can be significantly
  #                       over/under-tuned for wherever it lands).
  additional_enemies: off

  # Extra points added on top of whatever you roll at character creation,
  # 0-9 each, granted the moment you start. 0 (default) = vanilla, untouched.
  starting_strength: 0
  starting_dexterity: 0
  starting_constitution: 0
  starting_intelligence: 0
  starting_wisdom: 0
  starting_charisma: 0
  starting_computer_use: 0
  starting_demolitions: 0
  starting_stealth: 0
  starting_awareness: 0
  starting_persuade: 0
  starting_repair: 0
  starting_security: 0
  starting_treat_injury: 0


  # --- Experience / leveling ----------------------------------------------

  # Controls how (and whether) you receive AP-driven XP. Both ap_limited and
  # ap_gated clamp vanilla combat/quest XP down to an expected total on
  # every area transition -- this just changes how that expected total is
  # calculated.
  #   off (default): pure vanilla XP, completely untouched -- no clamping,
  #                  no items, normal combat/quest XP.
  #   ap_limited:    no items involved -- your expected XP is computed
  #                  directly from how many of YOUR OWN checks you've
  #                  completed, times experience_limiter. Your level
  #                  tracks your own progress, independent of item flow.
  #   ap_gated:      XP comes from "Experience Points" items received through
  #                  the Archipelago server. Each item is worth experience_item
  #                  XP. Your level depends on what other players/your items found.
  experience_mode: off

  # XP granted per YOUR OWN completed check, when experience_mode is
  # ap_limited. Range: 1-20000. Default 600 -- at full completion (~200
  # real locations checked), that's ~120,000 XP which is around level 16
  # Would suggest bumping limit/item higher if you are not interested in a challenge. 
  experience_limiter: 600

  # XP granted per "Experience Points" item received, when experience_mode
  # is ap_gated. Range: 1-20000. Default 4000 -- with the default 7-category
  # item distribution below, a full playthrough draws ~32 of these, landing
  # around 128,000 total XP (around level 16-17) , not a forced
  # grind to the level-20 cap and not a stalled-out early game either.

  experience_item: 4000

  #Developer Note - due to the way delivery of information between kotor client and game is handled
  #you will still earn exp and won't get an adjustment until you transition areas. So you could 
  #level up transition and the exp will not get adjusted below the level minimum. 
  #This is known design gap to be fixed


  # --- Credits -------------------------------------------------------------

  # Controls how (and whether) you receive AP-driven credits. Mirrors
  # experience_mode's shape exactly -- both ap_limited and ap_gated clamp
  # vanilla credit gains (loot, quest rewards, selling items) down to an
  # expected total, correcting continuously rather than only on area
  # transitions. A real spend (credits going down) is never fought --
  # detected and treated as legitimate, so buying gear is always safe.
  #   off (default): pure vanilla credits, completely untouched.
  #   ap_limited:    no items involved -- your expected credit total is
  #                  computed directly from how many of YOUR OWN checks
  #                  you've completed, times credit_limiter.
  #   ap_gated:      credits come from "Republic Credits" items received
  #                  through the Archipelago server. Each item is worth
  #                  credit_item credits.
  credit_mode: off

  # Credits granted per YOUR OWN completed check, when credit_mode is
  # ap_limited. Range: 1-20000.
  credit_limiter: 100

  # Credits granted per "Republic Credits" item received, when credit_mode
  # is ap_gated. Range: 1-20000.
  credit_item: 5000


  # --- Items, gear, and shops ----------------------------------------------

  # Whether curated gear (weapons, armor, other equipment) is ELIGIBLE to
  # appear in the AP item pool at all. false (default): the gear system is
  # completely inert -- no gear items in the pool, no shop stocking either.
  # true doesn't guarantee any specific gear item -- it just makes the
  # Weapons/Armor/Consumables categories below available to be drawn from.
  receive_inventory_items: false

  # How many of a received consumable (grenades, medpacs, stims -- anything
  # without an equipment slot) you get per item, capped by that item's own
  # real in-game stack limit either way. Range: 1-99. Equipment (weapons,
  # armor, wearables) always grants exactly 1 regardless of this.
  # NOTE: this only affects AP item GRANTS (a consumable arriving through
  # the multiworld). It has no effect on shop stock (shop_item_count below)
  # or consumables found/looted in the world (loot_mode below) -- those are
  # separate mechanisms and always use the item's own real vanilla quantity.
  consumable_stack_count: 10

  # Whether shops get restocked with a curated random selection at all.
  #   false (default): every shop keeps its normal vanilla inventory.
  #   true:             shop_item_count items get drawn from the curated
  #                     pool and stocked in every covered shop, replacing
  #                     its vanilla inventory on first visit.
  shop_randomizer: false

  # How many items to stock per shop when shop_randomizer is true.
  # Range: 1-30.
  shop_item_count: 30

  # What happens to a loot in the game world. 
  # (quest-critical items are always left alone regardless of this option).
  #   normal (default): untouched -- pure vanilla, nothing wired up at all.
  #   destroy:          Most loot is destroyed excluding quest items and scripted loot
  #   bonus:            one random item
  #                     (drawn from the same shop_randomize pool that
  #                     stocks shops) is granted every time a running count
  #                     of genuine non-whitelisted finds crosses a new
  #                     multiple of 5.
  #   replace:          available loot in the game is replaced at random
  #                     with one random item from the same pool, 1-for-1.
  # This is a real, game-file-level patch applied once by
  # scripts/patch_item_suppression.py (see README) -- this option only
  # Some game is left on vanilla due to scripting limitations
  # takes effect once that patch step has actually been run for your seed.
  # Valid: normal, destroy, bonus, replace
  loot_mode: normal

  # Controls how almost the ENTIRE item pool is composed. Only companions
  # (when companion_mode is ap_gated) are ever unconditionally guaranteed
  # in the pool -- everything else (curated gear, Skills, Abilities, EXP,
  # Credits) is drawn proportionally from the 7 categories below. Feats
  # are not an AP item at all any more -- left entirely to normal in-game
  # level-up choices.
  #   normal (default):    a fixed, project-chosen baseline distribution
  #                         (see the weights below) -- a sensible mix that
  #                         doesn't need any tuning.
  #   player_decided:      uses the 8 weight options below instead of the
  #                         fixed baseline.
  #   randomized:           same as player_decided, but the 8 weights are
  #                         randomly generated per seed instead.
  item_distribution_type: normal

  # Relative weights for item_distribution_type: player_decided (ignored
  # otherwise -- "normal" always uses this same 20/20/30/40/40/20/20/1
  # baseline internally). These do NOT need to add up to 100 -- they're
  # relative to each other, so doubling every value produces the same
  # distribution. A category with nothing real to draw from (e.g.
  # exp_weight when experience_mode is off, or trap_weight unless
  # enable_traps is item_filler) is skipped automatically and the rest
  # renormalized. Range: 0-100 each. Skill/Ability/Trap default low on
  # purpose -- meant to show up occasionally, not dominate the pool.
  # NOTE on consumable_weight specifically: this only controls how many
  # consumable AP item GRANTS show up in the pool -- not shop stock
  # (shop_item_count above) or consumables found/looted in the world
  # (loot_mode above), which are separate mechanisms with their own controls.
  weapon_weight: 20
  armor_weight: 20
  consumable_weight: 30
  exp_weight: 40
  credit_weight: 40
  skill_weight: 20
  ability_weight: 20
  trap_weight: 1


  # --- Area randomizer -------------------------------------------------------

  # Whether doors and area-transition triggers are shuffled to lead
  # somewhere other than their vanilla destination.
  #   off (default): vanilla, no shuffling.
  #   coupled: doors are shuffled in genuine pairs -- walk through a
  #     shuffled door and you can always walk straight back out the SAME
  #     door. Most doors (110 of 118 eligible) get this treatment.
  #   decoupled: the same doors are shuffled completely independently --
  #     no guarantee walking back through whatever door you find leads
  #     anywhere near where you came from. More traditional "you don't
  #     know where anything leads" entrance-randomizer feel.
  # This is a real, game-file-level patch applied once by
  # scripts/patch_door_randomizer.py (see README) -- this option only
  # takes effect once that patch step has actually been run for your seed.
  # Balance is not guaranteed, and this is not compatible with progression
  # system (either coupled or decoupled).
  # Valid: off, coupled, decoupled
  area_randomizer: off


  # --- Goal ------------------------------------------------------------------

  # What counts as winning the game.
  #   defeat_malak (default): won the moment Darth Malak is defeated
  #                aboard the Star Forge.
  #   true_balance: won once you've reached BOTH alignment extremes
  #                (Light Side 100 and Dark Side 0) at some point during the run
  #                 - not simultaneously
  #   max_level:    won on reaching character level 20, KOTOR's real
  #                level cap.
  #   reach_leviathan: won the moment you're captured aboard the Leviathan --
  #               
  goal: defeat_malak


  # --- Multiworld ----------------------------------------------------------

  # If another player on DeathLink dies, you die too, and vice versa.

  # Developer Note: This currently only kills the player character on loading to new area,
  # if you have a companion this will not kill you and only drop the PC to 1 health 
  # Works same as if you character dies in combat as soon as combat is over you get resurreced if one character is alive
  # this is a known design gap. Not currently called out as a bug
  # death link only is fired if your player character dies. Not if a companion dies.
  death_link: false

  # TrapLink: like DeathLink, for traps -- and genuinely cross-game (any
  # AP world using the same "TrapLink" Bounce convention, e.g. Super Mario
  # World). When a trap hits you, every other TrapLink player in the
  # multiworld gets one too -- and vice versa. Each recipient rolls their
  # OWN random trap type; the other game's specific trap is never read or
  # translated, just used as a "something bad happened" signal. A linked
  # trap is never sent back out again. Ignored entirely if enable_traps is
  # off for you.
  trap_link: false

  # Galactic Shop: one crate in the Ebon Hawk's cargo hold (renamed
  # "Galactic Shop") becomes a trade box shared with every other KOTOR
  # player in this multiworld -- KOTOR-exclusive, unlike TrapLink above
  # (only other KOTOR slots can deposit/receive). Put an item in -> it
  # goes into the shared pool and you get a Galactic Coin. Put a coin in
  # -> you get a random item some OTHER player deposited (never your own;
  # a Medpac if nobody has left anything). What you get arrives on your
  # next area transition, and the KOTOR Client must be connected to the
  # server when you use the box (offline uses are remembered and settled
  # on the next connect).
  # Enabling this also adds the archipelago vendor to the ebon hawk
  galactic_shop: false
